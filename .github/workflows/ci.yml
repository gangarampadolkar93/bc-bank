# This is a basic workflow to help you get started with Actions

name: github actions pipeline for ci

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: runner-1
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: compile java application
        run: mvn compile
      - name: test java application
        run: mvn test
  security-scan:
    runs-on: runner-1
    needs: build

    steps:
      - name: installing trivy
        run: |
          sudo apt-get install wget gnupg -y
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get -y update
          sudo apt-get -y install trivy
      - name: trivy scan
        run: trivy fs . --format json --output trivy-report.json
      - name: gitleaks scan
        run: gitleaks detect --source . --report-format json --report-path gitleaks-report.json